{% extends "base.html" %}

{% block content %}
<div class="watch-container">
    <div class="large-player">
        <!-- Video Player -->
        <div class="bg-black rounded-3 overflow-hidden d-flex justify-content-center" style="max-height:720px;">
            <video width="100%" height="auto" controls autoplay style="max-height:72vh;">
                <source src="/stream/{{ video.video_id }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Video Info -->
        <h4 class="mt-3 fw-bold">{{ video.title }}</h4>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center gap-2">
                <div class="avatar-placeholder" style="width:40px;height:40px;"></div>
                <div>
                    <h6 class="mb-0 fw-bold">{{ video.creator_name }}</h6>
                    <small class="text-muted">1.2M subscribers</small>
                </div>
                <button class="btn-subscribe ms-3" id="sub-btn"
                    onclick="subscribe('{{ video.creator_id }}')">Subscribe</button>
            </div>

            <div class="d-flex gap-2">
                <button class="btn-like" onclick="likeVideo('{{ video.video_id }}')">
                    <i class="bi bi-hand-thumbs-up" id="like-icon"></i>
                    <span id="like-count">{{ video.likes }}</span> |
                    <i class="bi bi-hand-thumbs-down border-start ps-2 ms-1"></i>
                </button>
                <button class="btn-like"><i class="bi bi-share"></i> Share</button>
            </div>
        </div>

        <!-- Description Box -->
        <div class="bg-light rounded-3 p-3 mb-4" style="background-color: #f2f2f2 !important;">
            <p class="fw-bold mb-1">{{ video.views }} views • {{ video.upload_date }}</p>
            <p class="mb-0">{{ video.description }}</p>
        </div>

        <!-- Comments -->
        <h5 class="mb-3">Comments</h5>
        <div class="d-flex gap-3 mb-4">
            <div class="avatar-placeholder"></div>
            <div class="flex-grow-1">
                <input type="text" class="form-control border-0 border-bottom" id="comment-text"
                    placeholder="Add a comment..." style="border-radius:0;background:transparent;">
                <div class="d-flex justify-content-end mt-2">
                    <button class="btn btn-sm rounded-pill btn-light me-2">Cancel</button>
                    <button class="btn btn-sm rounded-pill btn-primary"
                        onclick="postComment('{{ video.video_id }}')">Comment</button>
                </div>
            </div>
        </div>
        <div id="comments-list">
            <!-- Comments loaded via JS -->
        </div>
    </div>

    <!-- Related Videos Side -->
    <div class="related-bar">
        <h5 class="mb-3">Related Videos</h5>
        <div id="related-list" class="d-flex flex-column gap-3">
            <!-- Populated by JS -->
        </div>
    </div>
</div>

<script>
    // Keep existing scripts, just maybe different DOM IDs if changed?
    // IDs used: sub-btn, like-count, comment-text, comments-list, related-list
    // Those match the new structure.

    async function likeVideo(videoId) {
        const token = localStorage.getItem('token');
        if (!token) { alert('Please login to like'); return; }

        const res = await fetch('/like/' + videoId, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('like-count').innerText = data.likes;
        } else {
            alert(data.message);
        }
    }

    async function subscribe(channelId) {
        const token = localStorage.getItem('token');
        if (!token) { alert('Please login to subscribe'); return; }

        const res = await fetch('/subscribe/' + channelId, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        const btn = document.getElementById('sub-btn');
        if (data.message === 'Subscribed') {
            btn.classList.add('subscribed');
            btn.innerText = 'Subscribed';
        } else {
            btn.classList.remove('subscribed');
            btn.innerText = 'Subscribe';
        }
    }

    async function postComment(videoId) {
        const token = localStorage.getItem('token');
        if (!token) { alert('Please login to comment'); return; }

        const text = document.getElementById('comment-text').value;
        if (!text) return;

        const res = await fetch('/comment/' + videoId, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ text: text })
        });

        if (res.ok) {
            document.getElementById('comment-text').value = '';
            loadComments(videoId);
        } else {
            alert('Error posting comment');
        }
    }

    async function loadComments(videoId) {
        const res = await fetch('/comment/' + videoId);
        const comments = await res.json();
        const list = document.getElementById('comments-list');
        list.innerHTML = '';
        comments.forEach(c => {
            const div = document.createElement('div');
            div.classList.add('d-flex', 'gap-3', 'mb-3');
            div.innerHTML = `
            <div class="avatar-placeholder"></div>
            <div>
                <div class="d-flex align-items-center gap-2 mb-1">
                    <span class="fw-bold" style="font-size:0.9rem;">${c.username}</span>
                    <small class="text-muted" style="font-size:0.8rem;">${c.timestamp}</small>
                </div>
                <p class="mb-0" style="font-size:0.95rem;">${c.text}</p>
            </div>
        `;
            list.appendChild(div);
        });
    }

    // Helper for related videos
    async function loadRelated(videoId) {
        const res = await fetch('/recommended/' + videoId);
        const videos = await res.json();
        const list = document.getElementById('related-list');
        videos.forEach(v => {
            const div = document.createElement('div');
            div.className = 'd-flex gap-2';
            div.style.cursor = 'pointer';
            div.onclick = () => window.location.href = '/watch/' + v.video_id;
            div.innerHTML = `
            <img src="/thumbnail/${v.thumbnail}" style="width:168px;height:94px;border-radius:8px;object-fit:cover;">
            <div>
                <h6 class="mb-1 fw-bold" style="font-size:0.9rem;line-height:1.2rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${v.title}</h6>
                <small class="text-muted d-block">${v.creator_name}</small>
                <small class="text-muted">${v.views} views</small>
            </div>
        `;
            list.appendChild(div);
        });
    }

    async function checkSubscriptionStatus() {
        const token = localStorage.getItem('token');
        if (!token) return;

        try {
            const res = await fetch('/subscriptions', {
                headers: { 'Authorization': 'Bearer ' + token } // Changed from 'x-access-token' to 'Authorization' for consistency
            });
            if (res.ok) {
                const subs = await res.json();
                const creatorId = "{{ video.creator_id }}";
                const isSubscribed = subs.some(sub => sub.channel_id === creatorId);

                const btn = document.getElementById('sub-btn'); // Changed from 'subscribe-btn' to 'sub-btn'
                if (isSubscribed) {
                    btn.classList.add('subscribed');
                    // The original button uses 'btn-subscribe' class, not 'btn-dark'.
                    // We'll just update text and rely on 'subscribed' class for styling.
                    btn.textContent = 'Subscribed';
                }
            }
        } catch (e) {
            console.error(e);
        }
    }

    // Initial Load
    loadComments('{{ video.video_id }}');
    loadRelated('{{ video.video_id }}');
    checkSubscriptionStatus();
</script>
{% endblock %}
