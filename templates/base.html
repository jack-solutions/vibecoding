<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouClone</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link href="/static/styles.css" rel="stylesheet">
  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar border-bottom">
    <div class="d-flex align-items-center">
      <button class="btn btn-light rounded-circle border-0 me-3" style="width:40px;height:40px;padding:8px;"><i
          class="bi bi-list fs-4"></i></button>
      <a class="navbar-brand" href="/">
        <i class="bi bi-youtube text-danger fs-3 me-1"></i> YouClone
      </a>
    </div>

    <!-- Search Bar -->
    <div class="d-flex align-items-center flex-grow-1 justify-content-center">
      <form class="search-bar d-none d-md-flex" action="/results" method="GET">
        <input class="form-control" type="search" name="q" placeholder="Search">
        <button type="submit" class="btn"><i class="bi bi-search"></i></button>
      </form>
      <button class="btn btn-light rounded-circle ms-3 d-none d-md-block"
        style="width:40px;height:40px;background:#f2f2f2;"><i class="bi bi-mic-fill"></i></button>
    </div>

    <div class="d-flex align-items-center gap-2">
      <a href="/upload_page" class="btn btn-light rounded-circle border-0 d-none d-sm-inline-block" title="Create"><i
          class="bi bi-plus-lg fs-5"></i></a>
      <button class="btn btn-light rounded-circle border-0 d-none d-sm-inline-block" title="Notifications"><i
          class="bi bi-bell fs-5"></i></button>
      <div id="auth-buttons">
        <!-- Filled by JS -->
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container-fluid p-0">
    <!-- Sidebar -->
    <div class="sidebar d-none d-md-block">
      <a href="/" class="sidebar-link active">
        <i class="bi bi-house-door-fill pt-1"></i> <span>Home</span>
      </a>
      <a href="#" class="sidebar-link">
        <!-- Using lightning charge for Shorts approx -->
        <i class="bi bi-lightning-charge pt-1"></i> <span>Shorts</span>
      </a>
      <a href="/subscriptions" class="sidebar-link">
        <i class="bi bi-collection-play pt-1"></i> <span>Subscriptions</span>
      </a>

      <hr class="mx-3 my-2">

      <div class="px-3 py-2">
        <h6 class="fw-bold fs-6">You <i class="bi bi-chevron-right" style="font-size: 12px;"></i></h6>
      </div>
      <a href="/history" class="sidebar-link">
        <i class="bi bi-clock-history pt-1"></i> <span>History</span>
      </a>
      <a href="#" class="sidebar-link">
        <i class="bi bi-view-list pt-1"></i> <span>Playlists</span>
      </a>
      <a href="#" class="sidebar-link">
        <i class="bi bi-clock pt-1"></i> <span>Watch later</span>
      </a>
      <a href="#" class="sidebar-link">
        <i class="bi bi-hand-thumbs-up pt-1"></i> <span>Liked videos</span>
      </a>

      <hr class="mx-3 my-2">

      <div class="px-3 py-2">
        <h6 class="fw-bold fs-6">Explore</h6>
      </div>
      <a href="#" class="sidebar-link">
        <i class="bi bi-fire pt-1"></i> <span>Trending</span>
      </a>
      <a href="#" class="sidebar-link">
        <i class="bi bi-bag pt-1"></i> <span>Shopping</span>
      </a>
      <a href="#" class="sidebar-link">
        <i class="bi bi-music-note-beamed pt-1"></i> <span>Music</span>
      </a>
    </div>

    <!-- Content -->
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const authContainer = document.getElementById('auth-buttons');
    const uploadBtn = document.getElementById('upload-btn'); // Note: ID might need to be added to create button if we want to toggle it, but for now Create is static.
    // Actually the code below references specific ID "upload-btn".
    // I removed "upload-btn" ID from the Create button in this template?
    // Let me re-add it or just handle auth buttons.

    // In this new design, the 'Create' button (plus icon) is generally for authenticated users.
    // Let's assume we show standard buttons if logged in, and 'Sign in' if not.

    if (token) {
      authContainer.innerHTML = `
             <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width:32px;height:32px;font-size:14px;cursor:pointer;" onclick="logout()">U</div>
        `;
      // We could toggle other buttons too
    } else {
      authContainer.innerHTML = `
            <a href="/login_page" class="btn btn-outline-primary rounded-pill btn-sm d-flex align-items-center gap-1" style="font-weight:600;">
                <i class="bi bi-person-circle"></i> <span style="font-size:14px;">Sign in</span>
            </a>
        `;
    }

    function logout() {
      if (confirm("Sign out?")) {
        localStorage.removeItem('token');
        localStorage.removeItem('user_id');
        localStorage.removeItem('role');
        window.location.href = '/';
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
